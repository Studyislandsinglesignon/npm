    <style>
        :root {
    --primary: #fc2651;
    --primary-hover: #e91e47;
    --primary-light: rgba(252, 38, 81, 0.1);
    --primary-lighter: rgba(252, 38, 81, 0.05);
    --accent: #8b5cf6;
    --accent-light: rgba(139, 92, 246, 0.1);
    --success: #10b981;
    --warning: #f59e0b;
    --text: #1a1a1a;
    --text-muted: #6b7280;
    --text-light: #9ca3af;
    --bg: #ffffff;
    --bg-secondary: #f8fafc;
    --surface: #ffffff;
    --surface-hover: #f1f5f9;
    --border: #e2e8f0;
    --border-light: #f1f5f9;
    --glass: rgba(255, 255, 255, 0.8);
    --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
    --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
    --shadow-glow: 0 0 20px rgba(252, 38, 81, 0.3);
    --radius: 12px;
    --radius-sm: 8px;
    --radius-lg: 16px;
    --radius-xl: 20px;
    --gradient-primary: linear-gradient(135deg, #fc2651 0%, #e91e47 100%);
    --gradient-accent: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
    --gradient-surface: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
}

.dark-mode {
    --primary: #fc2651;
    --primary-hover: #ff4d75;
    --primary-light: rgba(252, 38, 81, 0.15);
    --primary-lighter: rgba(252, 38, 81, 0.08);
    --accent: #a855f7;
    --accent-light: rgba(168, 85, 247, 0.15);
    --success: #34d399;
    --warning: #fbbf24;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --text-light: #64748b;
    --bg: #0f172a;
    --bg-secondary: #1e293b;
    --surface: #1e293b;
    --surface-hover: #334155;
    --border: #334155;
    --border-light: #475569;
    --glass: rgba(30, 41, 59, 0.8);
    --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / 0.4);
    --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.5), 0 1px 2px -1px rgb(0 0 0 / 0.5);
    --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.5), 0 2px 4px -2px rgb(0 0 0 / 0.5);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.6), 0 4px 6px -4px rgb(0 0 0 / 0.6);
    --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.7), 0 8px 10px -6px rgb(0 0 0 / 0.7);
    --shadow-glow: 0 0 20px rgba(252, 38, 81, 0.4);
    --gradient-primary: linear-gradient(135deg, #fc2651 0%, #ff4d75 100%);
    --gradient-accent: linear-gradient(135deg, #a855f7 0%, #9333ea 100%);
    --gradient-surface: linear-gradient(135deg, #1e293b 0%, #334155 100%);
}

* {
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
    line-height: 1.6;
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

header {
    background: var(--gradient-primary);
    color: white;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow-lg);
    backdrop-filter: blur(20px);
}

.header-content {
    max-width: 1200px;
    margin: 0 auto;
    padding: 1.25rem 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1.5rem;
}

.logo {
    font-size: 1.75rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #ffffff 0%, rgba(255, 255, 255, 0.8) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.search-container {
    display: flex;
    flex: 1;
    max-width: 500px;
    gap: 0.75rem;
}

#searchBar {
    flex: 1;
    padding: 0.875rem 1rem;
    border: 0;
    border-radius: var(--radius);
    background: var(--glass);
    backdrop-filter: blur(20px);
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: var(--shadow-sm);
}

#searchBar:focus {
    background: var(--text);
    box-shadow: 0 0 0 3px rgba(252, 38, 81, 0.25), var(--shadow);
    transform: translateY(-1px);
    color: var(--glass);
}

#searchBar::placeholder {
    color: var(--text-muted);
}

#sortOptions {
    padding: 0.875rem 1rem;
    border: 0;
    border-radius: var(--radius);
    background: var(--glass);
    backdrop-filter: blur(20px);
    color: var(--text-muted);
    font-size: 15px;
    cursor: pointer;
    outline: none;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    min-width: 130px;
    box-shadow: var(--shadow-sm);
}

#sortOptions:hover {
    background: var(--text);
    transform: translateY(-1px);
    box-shadow: var(--shadow);
    color: var(--glass);
}

#filterOptions {
    padding: 0.875rem 1rem;
    border: 0;
    border-radius: var(--radius);
    background: var(--glass);
    backdrop-filter: blur(20px);
    color: var(--text-muted);
    font-size: 15px;
    cursor: pointer;
    outline: none;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    min-width: 130px;
    box-shadow: var(--shadow-sm);
}

#filterOptions:hover {
    background: var(--text);
    transform: translateY(-1px);
    box-shadow: var(--shadow);
    color: var(--glass);
}

.control-buttons {
    display: flex;
    gap: 0.5rem;
}

main {
    margin: 0 auto;
    padding: 2rem 1rem;
    padding-bottom: 6rem;
}

#zoneCount {
    margin: 0 0 1.5rem;
    font-size: 14px;
    color: var(--text-muted);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

#zoneCount::before {
    content: '';
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--primary);
}

#container,
#featuredZones {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 1.5rem;
}

.zone-item {
    background: var(--gradient-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: var(--shadow-sm);
}

.zone-item:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: var(--shadow-xl);
    border-color: var(--primary);
}

.zone-item:hover::before {
    opacity: 1;
}

.zone-item::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--primary-light);
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
    z-index: 1;
}

.zone-item img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
    background: var(--border-light);
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.zone-item:hover img {
    transform: scale(1.05);
}

.zone-item button {
    background: transparent;
    color: var(--text);
    border: 0;
    padding: 1.25rem 1rem;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    line-height: 1.4;
    text-align: center;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    min-height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 2;
}

.zone-item:hover button {
    color: var(--primary);
    background: rgba(252, 38, 81, 0.05);
}

#zoneViewer {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 1000;
    display: none;
    flex-direction: column;
    animation: slideInUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes slideInUp {
    from {
        transform: translateY(100%);
    }
    to {
        transform: translateY(0);
    }
}

.zone-header {
    background: var(--gradient-primary);
    color: white;
    padding: 0.4rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow-lg);
}

.zone-title {
    flex: 1;
    min-width: 0;
}

#zoneName {
    font-size: 1.25rem;
    font-weight: 700;
    margin: 0 0 0.25rem;
    line-height: 1.3;
}

#zoneId {
    display: none;
}

#zoneAuthor {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.8);
    text-decoration: none;
    transition: all 0.2s ease;
    font-weight: 500;
}

#zoneAuthor:hover {
    color: white;
    text-decoration: underline;
}

.zone-controls {
    display: flex;
    gap: 0.75rem;
}

.zone-controls button {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: white;
    padding: 0.625rem 1rem;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    backdrop-filter: blur(20px);
}

.zone-controls button:hover {
    background: rgba(255, 255, 255, 0.2);
    border-color: rgba(255, 255, 255, 0.5);
    transform: translateY(-1px);
    box-shadow: var(--shadow);
}

#zoneFrame {
    flex-grow: 1;
    border: none;
    width: 90%;
    height: 90%;
}

#popupOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    padding: 1rem;
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}

.popup {
    background: var(--surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-xl);
    width: 100%;
    max-width: 520px;
    max-height: 80vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    animation: slideInScale 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes slideInScale {
    from {
        transform: scale(0.9) translateY(20px);
        opacity: 0;
    }
    to {
        transform: scale(1) translateY(0);
        opacity: 1;
    }
}

.popup-header {
    background: var(--gradient-primary);
    color: white;
    padding: 1.25rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

#popupTitle {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 700;
}

#popupClose {
    background: rgba(255, 255, 255, 0.1);
    border: 0;
    color: white;
    font-size: 1.25rem;
    cursor: pointer;
    padding: 0.5rem;
    border-radius: var(--radius);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    line-height: 1;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(20px);
}

#popupClose:hover {

    <script>
const container = document.getElementById("container");
const zoneViewer = document.getElementById("zoneViewer");
let zoneFrame = document.getElementById("zoneFrame");
const searchBar = document.getElementById("searchBar");
const sortOptions = document.getElementById("sortOptions");
const filterOptions = document.getElementById("filterOptions");
const featuredContainer = document.getElementById("featuredZones");

const GH_USER = "freebuisness";
const POPULARITY_PERIODS = ["year", "month", "week", "day"];

let zones = [];
let popularityData = {};
let zonesURL = null;
let _allStatsCache = null;

const zonesurls = [
    "assets@main/zones.json",
    "assets@latest/zones.json",
    "assets@master/zones.json",
    "assets/zones.json"
];

function buildGhUrl(user, repo, tag, file) {
    const type = window.__jsdelivrWorkingType || "jsdelivr";
    const domain = window.__jsdelivrWorkingDomain || "cdn.jsdelivr.net";
    return window.__buildGhUrl({ user, repo, tag, file: file || "" }, type, domain);
}

function getJsdelivrBase() {
    const type = window.__jsdelivrWorkingType || "jsdelivr";
    const domain = window.__jsdelivrWorkingDomain || "cdn.jsdelivr.net";
    if (type === "statically") return "https://cdn.statically.io/gh";
    if (type === "rawcdn_githack") return "https://rawcdn.githack.com";
    if (type === "raw_githack") return "https://raw.githack.com";
    return "https://" + domain + "/gh";
}

function getCoverURL() {
    return buildGhUrl(GH_USER, "covers", "main", "").replace(/\/$/, "");
}

function getHtmlURL() {
    return buildGhUrl(GH_USER, "html", "main", "").replace(/\/$/, "");
}

function cleanFetch(url, opts) {
    return window.__robustFetch(url, opts);
}

function cacheBust(url) {
    return url + (url.indexOf("?") === -1 ? "?" : "&") + "t=" + Date.now();
}

function injectJsdelivrInterceptor(html) {
    const workingDomain = window.__jsdelivrWorkingDomain || "testingcf.jsdelivr.net";
    const workingType = window.__jsdelivrWorkingType || "jsdelivr";
    const blockedPattern = /https?:\/\/((?:cdn|fastly|gcore|quantil|originfastly|testingcf)\.jsdelivr\.net|cdn\.statically\.io|rawcdn\.githack\.com|raw\.githack\.com)\/(?:gh\/)?([^\/]+)\/([^@\/]+)[@\/]([^\/]+)\/(.*?)(?=["'\s]|$)/g;
    html = html.replace(blockedPattern, (match, host, user, repo, tag, file) => buildGhUrl(user, repo, tag, file));
    const template = window.__jsdelivrInjectScript || "";
    const injected = template
        .replace(/window\.__jsdelivrWorkingDomain/g, JSON.stringify(workingDomain))
        .replace(/window\.__jsdelivrWorkingType/g, JSON.stringify(workingType));
    if (html.indexOf("<head>") !== -1) {
        html = html.replace("<head>", "<head>" + injected);
    } else if (html.indexOf("<Head>") !== -1) {
        html = html.replace("<Head>", "<Head>" + injected);
    } else {
        html = injected + html;
    }
    return html;
}

function toTitleCase(str) {
    return str.replace(/\w\S*/g, text => text.charAt(0).toUpperCase() + text.substring(1).toLowerCase());
}

async function resolveZonesURL() {
    let url = buildGhUrl(GH_USER, "assets", "main", "zones.json");
    try {
        let shaResponse;
        try {
            shaResponse = await window.__fetchWithTimeout(
                "https://api.github.com/repos/freebuisness/assets/commits?t=" + Date.now(),
                { cache: "no-store" },
                8000
            );
        } catch (error) {}
        if (shaResponse && shaResponse.status === 200) {
            try {
                const shajson = await shaResponse.json();
                const sha = shajson[0] && shajson[0].sha;
                if (sha) return buildGhUrl(GH_USER, "assets", sha, "zones.json");
            } catch (error) {
                try {
                    const secondary = await window.__fetchWithTimeout(
                        "https://raw.githubusercontent.com/freebuisness/xml/refs/heads/main/sha.txt?t=" + Date.now(),
                        { cache: "no-store" },
                        8000
                    );
                    if (secondary && secondary.status === 200) {
                        const sha = (await secondary.text()).trim();
                        if (sha) return buildGhUrl(GH_USER, "assets", sha, "zones.json");
                    }
                } catch (error) {}
            }
        }
    } catch (error) {}
    return url;
}

async function fetchZonesJson() {
    zonesURL = await resolveZonesURL();
    const candidates = [zonesURL].concat(
        zonesurls.map(suffix => {
            const m = suffix.match(/^([^@\/]+)(?:@([^\/]+))?\/(.*)$/);
            if (!m) return null;
            return buildGhUrl(GH_USER, m[1], m[2] || "main", m[3]);
        }).filter(Boolean)
    );
    let lastError = null;
    for (const candidate of candidates) {
        try {
            const response = await cleanFetch(cacheBust(candidate));
            if (response && response.ok) {
                return await response.json();
            }
            lastError = new Error("HTTP " + (response && response.status));
        } catch (error) {
            lastError = error;
        }
    }
    throw lastError || new Error("Unable to load zones.json");
}

async function listZones() {
    await window.__jsdelivrReadyPromise;
    container.innerHTML = "Loading...";
    try {
        const json = await fetchZonesJson();
        zones = json;
        if (zones[0]) zones[0].featured = true;

        await Promise.all(POPULARITY_PERIODS.map(period => fetchPopularity(period)));
        sortZones();

        try {
            const search = new URLSearchParams(window.location.search);
            const id = search.get("id");
            const embed = window.location.hash.includes("embed");
            if (id) {
                const zone = zones.find(z => z.id + "" === id + "");
                if (zone) {
                    if (embed) {
                        openZoneEmbed(zone);
                    } else {
                        openZone(zone);
                    }
                }
            }
        } catch (error) {}

        populateTagFilter(json);
    } catch (error) {
        console.error(error);
        container.innerHTML = "Error loading zones: " + error;
    }
}

function populateTagFilter(json) {
    let allTags = [];
    for (const obj of json) {
        if (Array.isArray(obj.special)) allTags.push(...obj.special);
    }
    allTags = [...new Set(allTags)];
    const filterEl = document.getElementById("filterOptions");
    if (!filterEl) return;
    while (filterEl.children.length > 1) {
        filterEl.removeChild(filterEl.lastElementChild);
    }
    for (const tag of allTags) {
        const opt = document.createElement("option");
        opt.value = tag;
        opt.textContent = toTitleCase(tag);
        filterEl.appendChild(opt);
    }
}

function openZoneEmbed(zone) {
    if (zone.url.startsWith("http")) {
        window.open(zone.url, "_blank");
        return;
    }
    const url = zone.url.replace("{COVER_URL}", getCoverURL()).replace("{HTML_URL}", getHtmlURL());
    cleanFetch(cacheBust(url)).then(response => response.text()).then(html => {
        html = injectJsdelivrInterceptor(html);
        document.documentElement.innerHTML = html;
        const popup = document.createElement("div");
        popup.style.position = "fixed";
        popup.style.bottom = "20px";
        popup.style.right = "20px";
        popup.style.backgroundColor = "#cce5ff";
        popup.style.color = "#004085";
        popup.style.padding = "10px";
        popup.style.border = "1px solid #b8daff";
        popup.style.borderRadius = "5px";
        popup.style.boxShadow = "0px 0px 10px rgba(0,0,0,0.1)";
        popup.style.fontFamily = "Arial, sans-serif";
        popup.innerHTML = 'Play more games at <a href="https://gn-math.dev" target="_blank" style="color:#004085; font-weight:bold;">https://gn-math.dev</a>!';
        const closeBtn = document.createElement("button");
        closeBtn.innerText = "?";
        closeBtn.style.marginLeft = "10px";
        closeBtn.style.background = "none";
        closeBtn.style.border = "none";
        closeBtn.style.cursor = "pointer";
        closeBtn.style.color = "#004085";
        closeBtn.style.fontWeight = "bold";
        closeBtn.onclick = () => popup.remove();
        popup.appendChild(closeBtn);
        document.body.appendChild(popup);
        document.documentElement.querySelectorAll("script").forEach(oldScript => {
            const newScript = document.createElement("script");
            if (oldScript.src) {
                newScript.src = oldScript.src;
            } else {
                newScript.textContent = oldScript.textContent;
            }
            document.body.appendChild(newScript);
        });
    }).catch(error => alert("Failed to load zone: " + error));
}

async function fetchPopularity(duration) {
    if (!popularityData[duration]) popularityData[duration] = {};
    try {
        const response = await cleanFetch(
            "https://data.jsdelivr.com/v1/stats/packages/gh/freebuisness/html@main/files?period=" + duration
        );
        const data = await response.json();
        data.forEach(file => {
            const idMatch = file.name.match(/\/(\d+)\.html$/);
            if (idMatch) {
                const id = parseInt(idMatch[1]);
                popularityData[duration][id] = (file.hits && file.hits.total) || 0;
            }
        });
    } catch (error) {
        popularityData[duration][0] = 0;
    }
}

function popularityFor(period, id) {
    return (popularityData[period] && popularityData[period][id]) || 0;
}

function sortZones() {
    const sortBy = sortOptions.value;
    if (sortBy === "name") {
        zones.sort((a, b) => a.name.localeCompare(b.name));
    } else if (sortBy === "id") {
        zones.sort((a, b) => a.id - b.id);
    } else if (sortBy === "popular") {
        zones.sort((a, b) => popularityFor("year", b.id) - popularityFor("year", a.id));
    } else if (sortBy === "trendingMonth") {
        zones.sort((a, b) => popularityFor("month", b.id) - popularityFor("month", a.id));
    } else if (sortBy === "trendingWeek") {
        zones.sort((a, b) => popularityFor("week", b.id) - popularityFor("week", a.id));
    } else if (sortBy === "trendingDay") {
        zones.sort((a, b) => popularityFor("day", b.id) - popularityFor("day", a.id));
    }
    zones.sort((a, b) => (a.id === -1 ? -1 : b.id === -1 ? 1 : 0));
    if (featuredContainer.innerHTML === "") {
        displayFeaturedZones(zones.filter(z => z.featured));
    }
    displayZones(zones);
}

function makeZoneItem(file) {
    const zoneItem = document.createElement("div");
    zoneItem.className = "zone-item";
    zoneItem.onclick = () => openZone(file);
    const img = document.createElement("img");
    img.dataset.src = file.cover.replace("{COVER_URL}", getCoverURL()).replace("{HTML_URL}", getHtmlURL());
    img.alt = file.name;
    img.loading = "lazy";
    img.className = "lazy-zone-img";
    zoneItem.appendChild(img);
    const button = document.createElement("button");
    button.textContent = file.name;
    button.onclick = (event) => {
        event.stopPropagation();
        openZone(file);
    };
    zoneItem.appendChild(button);
    return zoneItem;
}

function observeLazyImages(scopeSelector) {
    const lazyImages = document.querySelectorAll(scopeSelector + " img.lazy-zone-img");
    const imageObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
            if (entry.isIntersecting && !zoneViewer.hidden) {
                const img = entry.target;
                img.src = img.dataset.src;
                img.classList.remove("lazy-zone-img");
                observer.unobserve(img);
            }
        });
    }, { rootMargin: "100px", threshold: 0.1 });
    lazyImages.forEach(img => imageObserver.observe(img));
}

function displayFeaturedZones(featuredZones) {
    featuredContainer.innerHTML = "";
    featuredZones.forEach(file => featuredContainer.appendChild(makeZoneItem(file)));
    if (featuredContainer.innerHTML === "") {
        featuredContainer.innerHTML = "No featured zones found.";
    } else {
        document.getElementById("allZonesSummary").textContent = "Featured Zones (" + featuredZones.length + ")";
    }
    observeLazyImages("#featuredZones");
}

function displayZones(list) {
    container.innerHTML = "";
    list.forEach(file => container.appendChild(makeZoneItem(file)));
    if (container.innerHTML === "") {
        container.innerHTML = "No zones found.";
    } else {
        document.getElementById("allSummary").textContent = "All Zones (" + list.length + ")";
    }
    observeLazyImages("#container");
}

function filterZones2() {
    const query = filterOptions.value;
    if (query === "none") {
        displayZones(zones);
    } else {
        const filteredZones = zones.filter(zone => zone.special && zone.special.includes(query));
        if (query.length !== 0) {
            document.getElementById("featuredZonesWrapper").removeAttribute("open");
        }
        displayZones(filteredZones);
    }
}

function filterZones() {
    const query = searchBar.value.toLowerCase();
    const filteredZones = zones.filter(zone => zone.name.toLowerCase().includes(query));
    if (query.length !== 0) {
        document.getElementById("featuredZonesWrapper").removeAttribute("open");
    }
    displayZones(filteredZones);
}

function openZone(file) {
    if (file.url.startsWith("http")) {
        window.open(file.url, "_blank");
        return;
    }
    const url = file.url.replace("{COVER_URL}", getCoverURL()).replace("{HTML_URL}", getHtmlURL());
    cleanFetch(cacheBust(url)).then(response => response.text()).then(html => {
        html = injectJsdelivrInterceptor(html);
        if (zoneFrame.contentDocument === null) {
            zoneFrame = document.createElement("iframe");
            zoneFrame.id = "zoneFrame";
            zoneViewer.appendChild(zoneFrame);
        }
        zoneFrame.contentDocument.open();
        zoneFrame.contentDocument.write(html);
        zoneFrame.contentDocument.close();
        document.getElementById("zoneName").textContent = file.name;
        document.getElementById("zoneId").textContent = file.id;
        document.getElementById("zoneAuthor").textContent = "by " + file.author;
        if (file.authorLink) {
            document.getElementById("zoneAuthor").href = file.authorLink;
        }
        zoneViewer.style.display = "block";
        try {
            const newUrl = new URL(window.location);
            newUrl.searchParams.set("id", file.id);
            history.pushState(null, "", newUrl.toString());
        } catch (error) {}
        zoneViewer.hidden = true;
    }).catch(error => alert("Failed to load zone: " + error));
}

function aboutBlank() {
    const newWindow = window.open("about:blank", "_blank");
    const current = zones.find(zone => zone.id + "" === document.getElementById("zoneId").textContent);
    if (!current) return;
    const zoneUrl = current.url.replace("{COVER_URL}", getCoverURL()).replace("{HTML_URL}", getHtmlURL());
    cleanFetch(cacheBust(zoneUrl)).then(response => response.text()).then(html => {
        html = injectJsdelivrInterceptor(html);
        if (newWindow) {
            newWindow.document.open();
            newWindow.document.write(html);
            newWindow.document.close();
        }
    });
}

function closeZone() {
    zoneViewer.hidden = false;
    zoneViewer.style.display = "none";
    if (zoneFrame.parentNode === zoneViewer) {
        zoneViewer.removeChild(zoneFrame);
    }
    try {
        const url = new URL(window.location);
        url.searchParams.delete("id");
        history.pushState(null, "", url.toString());
    } catch (error) {}
}

function downloadZone() {
    const zone = zones.find(zone => zone.id + "" === document.getElementById("zoneId").textContent);
    if (!zone) return;
    const zoneUrl = zone.url.replace("{HTML_URL}", getHtmlURL());
    cleanFetch(cacheBust(zoneUrl)).then(res => res.text()).then(text => {
        const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = zone.name + ".html";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    });
}

function fullscreenZone() {
    if (zoneFrame.requestFullscreen) {
        zoneFrame.requestFullscreen();
    } else if (zoneFrame.mozRequestFullScreen) {
        zoneFrame.mozRequestFullScreen();
    } else if (zoneFrame.webkitRequestFullscreen) {
        zoneFrame.webkitRequestFullscreen();
    } else if (zoneFrame.msRequestFullscreen) {
        zoneFrame.msRequestFullscreen();
    }
}

function sanitizeData(obj, maxStringLen = 1000, maxArrayLen = 10000) {
    if (typeof obj === "string") {
        return obj.length > maxStringLen ? obj.slice(0, maxStringLen) + "...[truncated]" : obj;
    }
    if (obj instanceof Uint8Array) {
        if (obj.length > maxArrayLen) {
            return "[Uint8Array too large (" + obj.length + " bytes), truncated]";
        }
        return obj;
    }
    if (Array.isArray(obj)) {
        return obj.map(item => sanitizeData(item, maxStringLen, maxArrayLen));
    }
    if (obj && typeof obj === "object") {
        const newObj = {};
        for (const key in obj) {
            if (Object.prototype.hasOwnProperty.call(obj, key)) {
                newObj[key] = sanitizeData(obj[key], maxStringLen, maxArrayLen);
            }
        }
        return newObj;
    }
    return obj;
}

async function saveData() {
    alert("This might take a while, dont touch anything other than this OK button");
    const result = {};
    result.cookies = document.cookie;
    result.localStorage = { ...localStorage };
    result.sessionStorage = { ...sessionStorage };
    result.indexedDB = {};

    const dbs = await indexedDB.databases();
    for (const dbInfo of dbs) {
        if (!dbInfo.name) continue;
        result.indexedDB[dbInfo.name] = {};
        await new Promise((resolve, reject) => {
            const openRequest = indexedDB.open(dbInfo.name, dbInfo.version);
            openRequest.onerror = () => reject(openRequest.error);
            openRequest.onsuccess = () => {
                const db = openRequest.result;
                const storeNames = Array.from(db.objectStoreNames);
                if (storeNames.length === 0) {
                    resolve();
                    return;
                }
                const transaction = db.transaction(storeNames, "readonly");
                const storePromises = [];
                for (const storeName of storeNames) {
                    result.indexedDB[dbInfo.name][storeName] = [];
                    const store = transaction.objectStore(storeName);
                    const getAllRequest = store.getAll();
                    storePromises.push(new Promise((res, rej) => {
                        getAllRequest.onsuccess = () => {
                            result.indexedDB[dbInfo.name][storeName] = sanitizeData(getAllRequest.result, 1000, 100);
                            res();
                        };
                        getAllRequest.onerror = () => rej(getAllRequest.error);
                    }));
                }
                Promise.all(storePromises).then(() => resolve());
            };
        });
    }

    result.caches = {};
    const cacheNames = await caches.keys();
    for (const cacheName of cacheNames) {
        const cache = await caches.open(cacheName);
        const requests = await cache.keys();
        result.caches[cacheName] = [];
        for (const req of requests) {
            const response = await cache.match(req);
            if (!response) continue;
            const cloned = response.clone();
            const contentType = cloned.headers.get("content-type") || "";
            let body;
            try {
                if (contentType.includes("application/json")) {
                    body = await cloned.json();
                } else if (contentType.includes("text") || contentType.includes("javascript")) {
                    body = await cloned.text();
                } else {
                    const buffer = await cloned.arrayBuffer();
                    body = btoa(String.fromCharCode(...new Uint8Array(buffer)));
                }
            } catch (e) {
                body = "[Unable to read body]";
            }
            result.caches[cacheName].push({ url: req.url, body, contentType });
        }
    }

    alert("Done, wait for the download to come");
    const link = document.createElement("a");
    link.href = URL.createObjectURL(new Blob([JSON.stringify(result)], { type: "application/octet-stream" }));
    link.download = Date.now() + ".data";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

async function loadData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async function (e) {
        const data = JSON.parse(e.target.result);

        if (data.cookies) {
            data.cookies.split(";").forEach(cookie => {
                document.cookie = cookie.trim();
            });
        }

        if (data.localStorage) {
            for (const key in data.localStorage) {
                localStorage.setItem(key, data.localStorage[key]);
            }
        }

        if (data.sessionStorage) {
            for (const key in data.sessionStorage) {
                sessionStorage.setItem(key, data.sessionStorage[key]);
            }
        }

        if (data.indexedDB) {
            for (const dbName in data.indexedDB) {
                const stores = data.indexedDB[dbName];
                await new Promise((resolve, reject) => {
                    const request = indexedDB.open(dbName, 1);
                    request.onupgradeneeded = ev => {
                        const db = ev.target.result;
                        for (const storeName in stores) {
                            if (!db.objectStoreNames.contains(storeName)) {
                                db.createObjectStore(storeName, { keyPath: "id", autoIncrement: true });
                            }
                        }
                    };
                    request.onsuccess = ev => {
                        const db = ev.target.result;
                        const transaction = db.transaction(Object.keys(stores), "readwrite");
                        transaction.onerror = () => reject(transaction.error);
                        let pendingStores = Object.keys(stores).length;
                        for (const storeName in stores) {
                            const objectStore = transaction.objectStore(storeName);
                            objectStore.clear().onsuccess = () => {
                                for (const item of stores[storeName]) {
                                    objectStore.put(item);
                                }
                                pendingStores--;
                                if (pendingStores === 0) resolve();
                            };
                        }
                    };
                    request.onerror = () => reject(request.error);
                });
            }
        }

        if (data.caches) {
            for (const cacheName in data.caches) {
                const cache = await caches.open(cacheName);
                await cache.keys().then(keys => Promise.all(keys.map(k => cache.delete(k))));
                for (const entry of data.caches[cacheName]) {
                    let responseBody;
                    if (entry.contentType.includes("application/json")) {
                        responseBody = JSON.stringify(entry.body);
                    } else if (entry.contentType.includes("text") || entry.contentType.includes("javascript")) {
                        responseBody = entry.body;
                    } else {
                        const binaryStr = atob(entry.body);
                        const len = binaryStr.length;
                        const bytes = new Uint8Array(len);
                        for (let i = 0; i < len; i++) {
                            bytes[i] = binaryStr.charCodeAt(i);
                        }
                        responseBody = bytes.buffer;
                    }
                    const headers = new Headers({ "content-type": entry.contentType });
                    const response = new Response(responseBody, { headers });
                    await cache.put(entry.url, response);
                }
            }
        }
        alert("Data loaded");
    };
    alert("This might take a while, dont touch anything other than this OK button");
    reader.readAsText(file);
}

async function getAllStats() {
    if (_allStatsCache) return _allStatsCache;

    const BASE_URL = "https://data.jsdelivr.com/v1/stats/packages/gh/freebuisness/html@main/files";
    const PERIOD = "year";
    const PAGE_BATCH = 5;

    let page = 1;
    let done = false;
    const combinedMap = Object.create(null);

    while (!done) {
        const pages = Array.from({ length: PAGE_BATCH }, (_, i) => page + i);
        const responses = await Promise.all(
            pages.map(p => {
                const u = BASE_URL + "?period=" + PERIOD + "&page=" + p + "&limit=100";
                return cleanFetch(u)
                    .then(r => (r && r.ok ? r.json() : []))
                    .catch(() => []);
            })
        );

        for (const data of responses) {
            if (!Array.isArray(data) || data.length === 0) {
                done = true;
                break;
            }
            for (const item of data) {
                if (!item || !item.name) continue;
                const match = item.name.match(/^\/(\d+)([.-])/);
                if (!match) continue;
                const id = match[1];
                if (!combinedMap[id]) {
                    combinedMap[id] = { hits: 0, bandwidth: 0 };
                }
                combinedMap[id].hits += (item.hits && item.hits.total) || 0;
                combinedMap[id].bandwidth += (item.bandwidth && item.bandwidth.total) || 0;
            }
        }
        page += PAGE_BATCH;
    }

    _allStatsCache = combinedMap;
    return combinedMap;
}

async function getStats(id) {
    id = String(id);
    const allStats = await getAllStats();
    return (allStats[id] && allStats[id].hits) || 0;
}
